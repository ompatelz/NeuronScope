name: Bug report
description: Report reproducible incorrect behavior in NeuronScope.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve NeuronScope. Do not include secrets or private datasets.
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the preset or configuration, seed, and exact steps.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
      placeholder: Commit SHA, branch, or release
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Python/Node versions, and deployment method.
