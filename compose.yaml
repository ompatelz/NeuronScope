name: neuronscope

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NEURONSCOPE_APP_NAME: NeuronScope API
    expose:
      - "8000"
    init: true
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=64m,mode=1777

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NEURONSCOPE_PORT:-8080}:8080"
    init: true
    read_only: true
    restart: unless-stopped
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
