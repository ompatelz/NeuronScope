name: neuronscope

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NEURONSCOPE_APP_NAME: NeuronScope API
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
    expose:
      - "8000"
    cpus: "1.50"
    mem_limit: 1536m
    pids_limit: 128
    init: true
    read_only: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NEURONSCOPE_BIND_ADDRESS:-127.0.0.1}:${NEURONSCOPE_PORT:-8080}:8080"
    cpus: "0.50"
    mem_limit: 128m
    pids_limit: 64
    init: true
    read_only: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=1777
      - /var/cache/nginx:size=16m,uid=101,gid=101
      - /var/run:size=1m,uid=101,gid=101
